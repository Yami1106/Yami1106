# Regenerates the contribution graphics shown in README.md.
# Everything is generated here and committed to this repo, so the README
# never depends on a third-party image server staying online.

name: Profile Art

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-art.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#3498db&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/snake-light.svg?color_snake=#3498db

      - name: Commit generated art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets
          git diff --cached --quiet || git commit -m "Update profile art"
          git push
